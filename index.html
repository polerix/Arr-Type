<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARR-TYPE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }
    #game-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #gameCanvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #loading-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      color: #0ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      letter-spacing: 4px;
      z-index: 10;
    }
    #loading-screen .title {
      font-size: 36px;
      color: #4af;
      margin-bottom: 20px;
      text-shadow: 0 0 20px #0af;
    }
    #loading-bar-wrap {
      width: 300px;
      height: 8px;
      background: #111;
      border: 1px solid #0ff;
      margin-top: 16px;
      overflow: hidden;
    }
    #loading-bar {
      height: 100%;
      background: linear-gradient(90deg, #0af, #0ff);
      width: 0%;
      transition: width 0.1s;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="loading-screen">
      <div class="title">ARR-TYPE</div>
      <div>LOADING...</div>
      <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
